<!-- Name the Hue — Supabase "Confirm signup" template.
     Paste into Supabase → Authentication → Emails → Templates → Confirm signup.
     Var: {{ .ConfirmationURL }} (the confirm link). -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Real game fonts; Apple/iOS Mail honour these, other clients fall back. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:transparent;font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#211d18;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:transparent;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#fbf8f1;border:1px solid #ded6c6;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(33,29,24,0.06);">

          <!-- Masthead: swatch mark + serif wordmark -->
          <tr>
            <td style="padding:28px 32px 22px;border-bottom:1px solid #ded6c6;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:14px;">
                    <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                      <td style="width:16px;height:16px;background:#e0a53f;border-radius:4px;"></td>
                      <td style="width:6px;"></td>
                      <td style="width:16px;height:16px;background:#c0472d;border-radius:4px;"></td>
                      <td style="width:6px;"></td>
                      <td style="width:16px;height:16px;background:#3f7fb0;border-radius:4px;"></td>
                    </tr></table>
                  </td>
                  <td style="font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:26px;letter-spacing:-0.02em;color:#211d18;">Name the Hue</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 12px;font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:28px;font-weight:600;letter-spacing:-0.01em;color:#211d18;">Confirm your email</h1>
              <p style="margin:0 0 26px;font-family:'Space Grotesk',Arial,sans-serif;font-size:15px;line-height:1.6;color:#6f675a;">
                One tap and you're in. Confirm your address to save your streaks, stats and daily results across every device you play on.
              </p>

              <!-- CTA -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 28px;">
                <tr>
                  <td style="border-radius:10px;background:#c0472d;box-shadow:0 1px 2px rgba(33,29,24,0.12);">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 30px;font-family:'Space Grotesk',Arial,sans-serif;font-size:15px;font-weight:600;color:#fbf8f1;text-decoration:none;border-radius:10px;">Confirm email &rarr;</a>
                  </td>
                </tr>
              </table>

              <p style="margin:0;font-family:'Space Grotesk',Arial,sans-serif;font-size:13px;line-height:1.6;color:#a49a88;">
                Didn't sign up? You can safely ignore this email. No account will be created.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #ded6c6;background:#f6f1e7;">
              <p style="margin:0;font-family:'Space Grotesk',Arial,sans-serif;font-size:12px;color:#a49a88;">
                Name the Hue, a daily colour guessing game.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
